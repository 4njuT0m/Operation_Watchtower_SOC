[single_ip_404]
action.webhook.enable_allowlist = 0
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = 0 8 * * *
dispatch.earliest_time = -1d
dispatch.latest_time = now
display.general.type = statistics
display.page.search.tab = statistics
enableSched = 1
quantity = 0
relation = greater than
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=cybersteps_web sourcetype="nginx:access"\
| rex "^(?<src_ip>\d+\.\d+\.\d+\.\d+)"\
| rex "\"(?<method>[A-Z]+)\s(?<url>\S+)"\
| rex "\"\s(?<status>\d{3})\s"\
| stats count as total_requests dc(url) as unique_paths count(eval(status=="404")) as not_found_count count(eval(status=="403")) as forbidden_count by src_ip\
| eval not_found_ratio = round(not_found_count/total_requests*100, 1)\
| where unique_paths > 50 AND not_found_ratio > 70\
| sort -total_requests

[Detection #2 — Brute Force Repeated Failed Logons]
action.webhook.enable_allowlist = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 1h
alert.track = 1
counttype = number of events
cron_schedule = 15 * * * *
dispatch.earliest_time = -1h
dispatch.latest_time = now
display.general.type = statistics
display.page.search.tab = statistics
enableSched = 1
quantity = 0
relation = greater than
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=cybersteps_windows EventCode=4625\
| stats count by Source_Network_Address, Account_Name\
| where count > 10\
| sort -count

